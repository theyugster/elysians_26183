version: '3.8'

services:
  api:
    build: .
    container_name: chaintrace_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/chaintrace_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=i4c_sih2026_super_secure_secret_token_key_change_in_prod
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - chaintrace_net

  db:
    image: postgres:16-alpine
    container_name: chaintrace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chaintrace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chaintrace_net

  redis:
    image: redis:7-alpine
    container_name: chaintrace_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - chaintrace_net

volumes:
  postgres_data:

networks:
  chaintrace_net:
    driver: bridge